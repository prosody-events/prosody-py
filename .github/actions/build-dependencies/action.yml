name: Install build dependencies
description: Install protoc and the libcurl headers that the Rust build needs.
runs:
  using: composite
  steps:
    # prost-build needs protoc. librdkafka includes curl/curl.h even when it
    # builds without curl, so it needs the libcurl headers. The runner image
    # already has cmake. Call apt-get directly so that a failed install fails
    # this step. An apt package cache can hide that failure and save no files.
    - name: Install protoc and libcurl headers
      shell: bash
      env:
        PROTOC_VERSION: "36.2"
      run: |
        curl -sSfL -o "$RUNNER_TEMP/protoc.zip" \
          "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" &
        protoc=$!
        sudo apt-get update -qq
        sudo apt-get install -qq --yes --no-install-recommends libcurl4-openssl-dev
        wait "$protoc"
        sudo unzip -q -o "$RUNNER_TEMP/protoc.zip" 'bin/*' 'include/*' -d /usr/local
        protoc --version
