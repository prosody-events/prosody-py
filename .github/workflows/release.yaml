name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      retry_version:
        description: Rebuild and publish the current version without running Release Please
        required: false
        type: string
      release_as:
        description: 'Force release version (e.g. 2.2.0-alpha.1)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release_context.outputs.release_created }}
    steps:
      - uses: actions/checkout@v6
      - name: Release Please Action
        if: inputs.retry_version == ''
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GH_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ github.event.inputs.release_as }}

      - name: Resolve release context
        id: release_context
        env:
          RETRY_VERSION: ${{ inputs.retry_version }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
        run: |
          if [[ -n "$RETRY_VERSION" ]]; then
            package_version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "prosody-py") | .version')
            if [[ "$RETRY_VERSION" != "$package_version" ]]; then
              echo "::error::Retry version $RETRY_VERSION does not match package version $package_version"
              exit 1
            fi
            release_created=true
          else
            release_created=${RELEASE_CREATED:-false}
          fi

          echo "release_created=$release_created" >> "$GITHUB_OUTPUT"

  linux:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: ${{ matrix.platform.target == 'aarch64' && '2_24' || 'auto' }}
          before-script-linux: |
            if command -v apk > /dev/null; then
              apk add --no-cache cmake make curl-dev protobuf
            elif command -v yum > /dev/null; then
              yum install -y cmake curl libcurl-devel unzip
              case "$(uname -m)" in
                x86_64) protoc_arch=x86_64 ;;
                aarch64) protoc_arch=aarch_64 ;;
                *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              curl -fsSL \
                "https://github.com/protocolbuffers/protobuf/releases/download/v25.9/protoc-25.9-linux-${protoc_arch}.zip" \
                -o /tmp/protoc.zip
              unzip -q /tmp/protoc.zip -d /usr/local
              protoc --version
            elif command -v apt-get > /dev/null; then
              apt-get update
              apt-get install -y cmake libcurl4-openssl-dev protobuf-compiler
              # Headers land under a multiarch dir (e.g. x86_64-linux-gnu or
              # aarch64-linux-gnu depending on the runner). Symlink into the
              # cross-compiler's sysroot where GCC actually searches.
              curl_include=$(dirname "$(find /usr/include -name 'curl.h' | head -1)")
              ln -sf "$curl_include" \
                /usr/aarch64-unknown-linux-gnu/aarch64-unknown-linux-gnu/sysroot/usr/include/curl
            fi

      - name: Attest wheels
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: musllinux_1_2
          before-script-linux: |
            if command -v apk > /dev/null; then
              apk add --no-cache cmake make curl-dev protobuf
            elif command -v yum > /dev/null; then
              yum install -y cmake curl libcurl-devel unzip
              case "$(uname -m)" in
                x86_64) protoc_arch=x86_64 ;;
                aarch64) protoc_arch=aarch_64 ;;
                *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              curl -fsSL \
                "https://github.com/protocolbuffers/protobuf/releases/download/v25.9/protoc-25.9-linux-${protoc_arch}.zip" \
                -o /tmp/protoc.zip
              unzip -q /tmp/protoc.zip -d /usr/local
              protoc --version
            elif command -v apt-get > /dev/null; then
              apt-get update && apt-get install -y cmake libcurl4-openssl-dev protobuf-compiler
              # Headers land under a multiarch dir (arch-dependent). Symlink into
              # each musl cross-compiler's include dir (already exists in the image).
              curl_include=$(dirname "$(find /usr/include -name 'curl.h' | head -1)")
              for target_dir in /usr/local/musl/*-unknown-linux-musl/; do
                ln -sf "$curl_include" "${target_dir}include/curl"
              done
            fi

      - name: Attest wheels
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Install protobuf compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "25.9"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
      - name: Attest wheels
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        platform:
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "25.9"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
      - name: Attest wheels
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Attest sdist
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    environment: release
    runs-on: ubuntu-latest
    needs: [ release-please, linux, musllinux, windows, macos, sdist ]
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always wheels-*/*
